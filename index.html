<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f6f1e8" />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='50' font-size='90' text-anchor='middle' dominant-baseline='central'%3E%F0%9F%92%8D%3C/text%3E%3C/svg%3E" />
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700&family=Song+Myung&family=Gamja+Flower&family=Pretendard:wght@400;500;600&family=Parisienne&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <!-- 네이버 클라우드 플랫폼 콘솔 > Maps > Application 에서 발급받은 Client ID를 YOUR_NCP_CLIENT_ID 자리에 넣으세요.
       콘솔의 '서비스 환경'에 이 페이지가 배포될 도메인(예: https://wsoarc.github.io)을 등록해야 지도가 뜹니다. -->
  <script type="text/javascript"
    src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=YOUR_NCP_CLIENT_ID"></script>
</head>

<body>
  <main id="app" class="card" aria-live="polite">
    <div class="loading">
      <svg class="loading-envelope" viewBox="0 0 64 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect class="envelope-body" x="2" y="6" width="60" height="40" rx="4" fill="none" stroke="var(--color-accent)"
          stroke-width="2.5" />
        <path class="envelope-heart" d="M32 26c-3-4-9-2.5-9 2 0 4 5.5 7.5 9 10.5 3.5-3 9-6.5 9-10.5 0-4.5-6-6-9-2z"
          fill="var(--color-accent)" />
        <path class="envelope-flap" d="M2 8 L32 28 L62 8" fill="none" stroke="var(--color-accent)" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
  </main>
  <div class="floating" aria-label="빠른 기능"><button id="musicButton" class="float-button" aria-label="배경 음악 재생"
      aria-pressed="false">♪</button><button id="shareButton" class="float-button" aria-label="청첩장 공유">↗</button></div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="script.js"></script>
</body>

</html>
