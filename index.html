    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script>
    // type="module" 스크립트는 파싱 완료 후 실행되어 로드 초반에 확대가 새는 순간이 생김.
    // 그래서 확대 차단 로직은 head에서 최대한 빨리 동기 실행함.
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(evt =>
      document.addEventListener(evt, e => e.preventDefault(), { passive: false })
    );
    // gesturestart는 Safari가 "확대 제스처"로 확정한 뒤에야 발화하는 후행 이벤트라,
    // 빠르게 두 손가락을 벌리면 네이티브 줌 인식이 이 이벤트보다 먼저 이겨서 preventDefault가 늦을 수 있음.
    // touchstart/touchmove 시점에 손가락 2개 이상이면 선제적으로 즉시 차단.
    function __preventMultiTouch(e) {
      if (e.touches && e.touches.length > 1) e.preventDefault();
    }
    document.addEventListener('touchstart', __preventMultiTouch, { passive: false });
    document.addEventListener('touchmove', __preventMultiTouch, { passive: false });

    // 위 차단을 뚫고 순간적으로 확대가 새는 경우(빠른 핀치, WebKit 네이티브 제스처가 JS보다 먼저 시작되는 케이스)를
    // 대비한 안전망: visualViewport 배율이 1보다 커지면 즉시 뷰포트를 다시 선언해 강제로 100%로 되돌림.
    if (window.visualViewport) {
      const __viewportMeta = document.querySelector('meta[name="viewport"]');
      const __resetContent = __viewportMeta.getAttribute('content');
      // content를 그대로 재대입하면 값이 안 변했다고 판단해 브라우저가 무시하는 경우가 있어,
      // maximum-scale 값을 잠깐 다르게 바꿨다가(중복 선언 없이 치환) 원래 값으로 복원해 강제로 리플로우시킴.
      const __bumpContent = __resetContent.replace(/maximum-scale=[^,]+/, 'maximum-scale=0.9999');
      let __resetTimer = null;
      window.visualViewport.addEventListener('resize', () => {
        if (window.visualViewport.scale > 1.001) {
          clearTimeout(__resetTimer);
          __resetTimer = setTimeout(() => {
            __viewportMeta.setAttribute('content', __bumpContent);
            requestAnimationFrame(() => __viewportMeta.setAttribute('content', __resetContent));
          }, 30);
        }
      });
    }
  </script>
  <!-- 네이버 클라우드 플랫폼 콘솔 > Maps > Application 에서 발급받은 Client ID를 YOUR_NCP_CLIENT_ID 자리에 넣으세요.
       콘솔의 '서비스 환경'에 이 페이지가 배포될 도메인(예: https://wsoarc.github.io)을 등록해야 지도가 뜹니다. -->
  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=0zu1kqt2fz"></script>
