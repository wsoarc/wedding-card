<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f1e8" /><title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Nanum+Myeongjo:wght@400;700&family=Pretendard:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body><main id="app" class="card" aria-live="polite"><div class="loading">초대장을 준비하고 있어요</div></main>
  <div class="floating" aria-label="빠른 기능"><button id="musicButton" class="float-button" aria-label="배경 음악 재생" aria-pressed="false">♪</button><button id="shareButton" class="float-button" aria-label="청첩장 공유">↗</button></div>
  <div id="toast" class="toast" role="status"></div><div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-label="갤러리 크게 보기"><button class="lightbox-close" aria-label="닫기">×</button><button class="lightbox-prev" aria-label="이전 사진">‹</button><img id="lightboxImage" alt="" /><button class="lightbox-next" aria-label="다음 사진">›</button><p id="lightboxCount"></p></div>
  <script src="script.js"></script>
</body></html>
