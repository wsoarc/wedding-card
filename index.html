<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f6f1e8" />
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Nanum+Myeongjo:wght@400;700&family=Pretendard:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <!-- 네이버 클라우드 플랫폼 콘솔 > Maps > Application 에서 발급받은 Client ID를 YOUR_NCP_CLIENT_ID 자리에 넣으세요.
       콘솔의 '서비스 환경'에 이 페이지가 배포될 도메인(예: https://wsoarc.github.io)을 등록해야 지도가 뜹니다. -->
  <script type="text/javascript"
    src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=YOUR_NCP_CLIENT_ID"></script>
</head>

<body>
  <main id="app" class="card" aria-live="polite">
    <div class="loading">초대장을 준비하고 있어요</div>
  </main>
  <div class="floating" aria-label="빠른 기능"><button id="musicButton" class="float-button" aria-label="배경 음악 재생"
      aria-pressed="false">♪</button><button id="shareButton" class="float-button" aria-label="청첩장 공유">↗</button></div>
  <div id="toast" class="toast" role="status"></div>
  <script src="script.js"></script>
</body>

</html>
